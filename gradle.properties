org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official

# 注意：这里曾经硬编码了一个本地代理（systemProp.*.proxyHost=127.0.0.1:18080）。
# 那是开发机本地环境的配置，一旦换机器 / CI / 离线构建就会让 Gradle 全部下载超时失败，
# 因此已移除。如果确实处在必须走代理的网络里，请不要写回本文件，改用以下任一方式：
#   1) 命令行：./gradlew -Dhttp.proxyHost=... -Dhttp.proxyPort=... assembleDebug
#   2) 用户级：~/.gradle/gradle.properties（不进版本库，不影响他人）
#   3) 环境变量：GRADLE_OPTS="-Dhttp.proxyHost=... -Dhttp.proxyPort=..."
org.gradle.workers.max=2
